name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Python checks and telemetry artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile backend/main.py backend/config.py backend/security.py training/train.py training/screen_channels.py training/export_predictions.py
      - run: |
          python - <<'PY'
          import json
          payload = json.load(open("backend/telemetry_D-1.json", encoding="utf-8"))
          points = payload["points"]
          assert payload["sensor_id"] == "D-1", payload.get("sensor_id")
          assert len(points) == 8459, len(points)
          assert payload["model"]["inference"] == "precomputed"
          assert payload["stats"]["ref_std"] > 0
          print(f"telemetry ok: {len(points)} points, ratio {payload['stats']['anomaly_ratio']}")
          PY
      - run: pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest backend/tests -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=high
        working-directory: frontend
